name: Ask2GPT Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm verify
      - run: pnpm package
      - id: version
        name: Verify release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Create checksums
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256sum "ask2gpt-${version}.vsix" "ask2gpt-relay-${version}.zip" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" \
            "ask2gpt-${version}.vsix#Ask2GPT VS Code extension" \
            "ask2gpt-relay-${version}.zip#Ask2GPT Chrome Relay" \
            "SHA256SUMS.txt#SHA-256 checksums" \
            --verify-tag \
            --generate-notes \
            --title "Ask2GPT ${version}"
