<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask2GPT Webview Preview</title>
    <link rel="stylesheet" href="/webview/webview.css" />
    <style>
      :root {
        color-scheme: dark;
        --vscode-button-background: #0e639c;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #1177bb;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-dropdown-background: #181818;
        --vscode-dropdown-border: #3f3f46;
        --vscode-dropdown-foreground: #cccccc;
        --vscode-editor-background: #181818;
        --vscode-editor-foreground: #cccccc;
        --vscode-focusBorder: #007fd4;
        --vscode-foreground: #cccccc;
        --vscode-input-background: #1f1f1f;
        --vscode-input-border: #3f3f46;
        --vscode-input-foreground: #cccccc;
        --vscode-panel-border: #2b2b2b;
        --vscode-sideBar-background: #181818;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--vscode-sideBar-background);
        color: var(--vscode-foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .preview-controls {
        position: fixed;
        z-index: 1000;
        right: 12px;
        bottom: 12px;
        display: flex;
        max-width: calc(100vw - 24px);
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--vscode-panel-border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--vscode-editor-background) 92%, transparent);
        box-shadow: 0 8px 24px rgb(0 0 0 / 32%);
      }

      .preview-controls[hidden] {
        display: none;
      }

      .preview-controls button {
        padding: 5px 8px;
        border: 1px solid var(--vscode-dropdown-border);
        border-radius: 4px;
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        cursor: pointer;
      }

      .preview-controls button:hover {
        background: var(--vscode-button-hoverBackground);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <section class="preview-controls" id="preview-controls" aria-label="Preview controls" hidden>
      <button type="button" data-preview-action="stream">流式长回答</button>
      <button type="button" data-preview-action="complete">完成</button>
      <button type="button" data-preview-action="error">错误</button>
      <button type="button" data-preview-action="reconnect">重连</button>
      <button type="button" data-preview-action="switch">切换会话</button>
    </section>
    <script id="ask2gpt-initial-state" type="application/json">
      __ask2gpt_INITIAL_STATE__
    </script>
    <script src="/preview/harness.js"></script>
    <script src="/webview/webview.js"></script>
  </body>
</html>
